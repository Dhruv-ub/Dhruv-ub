<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="07 Activity"><title>07 Activity</title>
<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.3) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
</style>
<defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><linearGradient id="acu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
<rect width="1000" height="64" rx="12" fill="#0b1020"/>
<rect x="14" y="12" width="46" height="34" rx="10" fill="url(#ac)"/><text class="m" x="37" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1020">07</text>
<text class="up" x="76" y="38" font-size="24" font-weight="700" fill="#e2e8f0">Activity</text>
<text class="m" x="986" y="36" text-anchor="end" font-size="12" fill="#94a3b8">contribution graph</text>
<path d="M14 56 H986" stroke="url(#acu)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1000" style="animation:draw 1.8s ease-out both"/>
<circle r="3.2" fill="#fff"><animateMotion path="M14 56 H986" dur="4.5s" repeatCount="indefinite"/></circle>
</svg>