<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 214" width="1000" height="214" role="img" aria-label="Live status: building diabetic retinopathy grading, exploring evaluation and calibration, open to ML roles"><title>Live status: building diabetic retinopathy grading, exploring evaluation and calibration, open to ML roles</title>
<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.3) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:translateX(0)}}
.row{animation:slide .8s cubic-bezier(.2,.8,.2,1) both}
</style>
<defs><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#0e7490" stop-opacity="0"/><stop offset=".5" stop-color="#0e7490" stop-opacity=".10"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></linearGradient><clipPath id="c"><rect width="1000" height="214" rx="16"/></clipPath><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e7490"/><stop offset=".5" stop-color="#6d28d9"/><stop offset="1" stop-color="#be185d"/></linearGradient></defs>
<g clip-path="url(#c)"><rect width="1000" height="214" fill="#ffffff"/><rect x="-140" y="0" width="140" height="214" fill="url(#sw)"><animate attributeName="x" values="-140;1000" dur="6s" repeatCount="indefinite"/></rect></g>
<circle cx="38" cy="34" r="6" fill="#047857"/><circle cx="38" cy="34" r="6" fill="#047857" fill-opacity=".5"><animate attributeName="r" values="6;16;6" dur="2s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values=".5;0;.5" dur="2s" repeatCount="indefinite"/></circle>
<text class="m" x="58" y="39" font-size="13" letter-spacing="3" fill="#047857">LIVE STATUS</text>
<text class="m" x="976" y="39" text-anchor="end" font-size="12" fill="#59636e">as of Oct 2026</text>
<g class="row" style="animation-delay:0.2s"><rect x="28" y="62" width="112" height="32" rx="9" fill="#0e7490" fill-opacity=".12" stroke="#0e7490" stroke-opacity=".6"/><text class="m" x="84" y="83" text-anchor="middle" font-size="12" letter-spacing="1.5" font-weight="700" fill="#0e7490">BUILDING</text><text x="158" y="84" font-size="15" fill="#1f2328">Diabetic retinopathy grading · CNN ensembles · calibrated · evaluated out-of-fold</text></g>
<g class="row" style="animation-delay:0.5s"><rect x="28" y="110" width="112" height="32" rx="9" fill="#6d28d9" fill-opacity=".12" stroke="#6d28d9" stroke-opacity=".6"/><text class="m" x="84" y="131" text-anchor="middle" font-size="12" letter-spacing="1.5" font-weight="700" fill="#6d28d9">EXPLORING</text><text x="158" y="132" font-size="15" fill="#1f2328">Rigorous model evaluation · calibration · efficient inference (ONNX, quantization)</text></g>
<g class="row" style="animation-delay:0.8s"><rect x="28" y="158" width="112" height="32" rx="9" fill="#be185d" fill-opacity=".12" stroke="#be185d" stroke-opacity=".6"/><text class="m" x="84" y="179" text-anchor="middle" font-size="12" letter-spacing="1.5" font-weight="700" fill="#be185d">OPEN TO</text><text x="158" y="180" font-size="15" fill="#1f2328">ML / AI engineering roles · research collaborations · open source</text></g>
