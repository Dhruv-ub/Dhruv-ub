<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
